<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search simple and delicious recipes by meal name or ingredient.">
  <title>Simple Recipe Finder</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- HEADER: [Logo] Recipe Finder   [Home] [Favorites] -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/logo.svg" alt="" width="36" height="36">
        <span>Recipe Finder</span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html" aria-current="page">Home</a></li>
          <li><a href="favorites.html">Favorites</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <!-- HERO: Find Your Recipe + search form -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero-inner">
        <h1 id="hero-title">Find Your Recipe</h1>
        <p class="hero-text">Search for simple and delicious recipes.</p>

        <form id="search-form" class="search-form" role="search" novalidate>
          <label for="search-input" class="visually-hidden">Search for a recipe or ingredient</label>
          <input
            id="search-input"
            name="q"
            type="search"
            placeholder="Search for a recipe (try chicken, pasta, rice)"
            autocomplete="off"
            aria-describedby="form-message"
          >
          <button type="submit" class="btn btn--primary">Search</button>
        </form>
        <p id="form-message" class="form-message" role="alert" hidden></p>
      </div>
    </section>

    <!-- CATEGORY FILTERS -->
    <section class="container categories" aria-labelledby="categories-title">
      <h2 id="categories-title" class="section-title">Browse Categories</h2>
      <div id="category-list" class="category-list">
        <button type="button" class="chip" data-category="Breakfast" aria-pressed="false">Breakfast</button>
        <button type="button" class="chip" data-category="Lunch" aria-pressed="false">Lunch</button>
        <button type="button" class="chip" data-category="Dinner" aria-pressed="false">Dinner</button>
        <button type="button" class="chip" data-category="Dessert" aria-pressed="false">Dessert</button>
      </div>
    </section>

    <!-- RECIPE RESULTS: Recipes ........ [Random Recipe] -->
    <section class="container results" aria-labelledby="results-title">
      <div class="results-header">
        <div>
          <h2 id="results-title" class="section-title">Recipes</h2>
          <p id="results-summary" class="results-summary" aria-live="polite"></p>
        </div>
        <button type="button" id="random-button" class="btn btn--outline">Random Recipe</button>
      </div>

      <p id="notice" class="message message--notice" role="status" hidden></p>

      <div id="loading" class="loading" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading recipes…</span>
      </div>

      <div id="error" class="message message--error" role="alert" hidden></div>

      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-state__title">No recipes found. Try another search.</p>
      </div>

      <div id="results-grid" class="recipe-grid"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <p>Simple Recipe Finder &copy; 2026</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
