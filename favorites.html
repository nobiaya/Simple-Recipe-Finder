<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your saved favorite recipes.">
  <title>Favorites | Simple Recipe Finder</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/logo.svg" alt="" width="36" height="36">
        <span>Recipe Finder</span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="favorites.html" aria-current="page">Favorites</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container favorites-page">
    <div class="results-header">
      <h1 class="page-title">Favorites</h1>
      <p id="favorites-count" class="results-summary" aria-live="polite" hidden></p>
    </div>

    <div id="favorites-empty" class="empty-state" hidden>
      <p class="empty-state__title">You haven't saved any recipes yet.</p>
      <a class="btn btn--primary" href="index.html">Explore Recipes</a>
    </div>

    <div id="favorites-grid" class="recipe-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Simple Recipe Finder &copy; 2026</p>
    </div>
  </footer>

  <script type="module" src="js/favorites.js"></script>
</body>
</html>
