<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ingredients and cooking instructions for your selected recipe.">
  <title>Recipe | Simple Recipe Finder</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- HEADER: [← Back to Recipes]     Recipe Finder [Favorites] -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Back to Recipes</a>
      <a class="brand brand--center" href="index.html">
        <img src="images/logo.svg" alt="" width="36" height="36">
        <span>Recipe Finder</span>
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="favorites.html">Favorites</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container detail-page">
    <div id="loading" class="loading" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading recipe…</span>
    </div>

    <div id="error" class="message message--error" role="alert" hidden></div>

    <!-- RECIPE DETAILS -->
    <article id="recipe-content" class="recipe-detail" hidden>
      <section class="detail-top" aria-labelledby="recipe-name">
        <img id="recipe-image" class="detail-image" src="images/placeholder.svg" alt="" width="640" height="480">

        <div class="detail-info">
          <h1 id="recipe-name" class="detail-title">Recipe</h1>
          <dl class="detail-meta">
            <div><dt>Category</dt><dd id="recipe-category">Not available</dd></div>
            <div><dt>Cuisine</dt><dd id="recipe-cuisine">Not available</dd></div>
            <div><dt>Cooking Time</dt><dd id="recipe-time">Not available</dd></div>
            <div><dt>Servings</dt><dd id="recipe-servings">Not available</dd></div>
          </dl>
          <p id="recipe-summary" class="detail-summary"></p>
          <div id="favorite-slot"></div>
        </div>
      </section>

      <!-- INGREDIENTS -->
      <section class="detail-section" aria-labelledby="ingredients-title">
        <h2 id="ingredients-title" class="section-title">Ingredients</h2>
        <div id="ingredients-slot"></div>
      </section>

      <!-- COOKING INSTRUCTIONS -->
      <section class="detail-section" aria-labelledby="instructions-title">
        <h2 id="instructions-title" class="section-title">Cooking Instructions</h2>
        <div id="instructions-slot"></div>
      </section>

      <p id="recipe-source" class="detail-source"></p>

      <a class="btn btn--outline back-button" href="index.html"><span aria-hidden="true">←</span> Back to Recipes</a>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Simple Recipe Finder &copy; 2026</p>
    </div>
  </footer>

  <script type="module" src="js/recipe.js"></script>
</body>
</html>
